services:
  db:
    image: postgres:15
    container_name: library_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: library_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: library_api
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - qdrant
    restart: unless-stopped

  bench:
    image: python:3.13-slim
    container_name: library_bench
    working_dir: /app
    volumes:
      - ./backend:/app
    depends_on:
      - api
    command: >
      sh -c "pip install requests matplotlib sentence-transformers &&
      echo 'Waiting for API...' &&
      until python -c 'import requests; r=requests.get(\"http://api:8001/health\"); exit(0 if r.ok else 1)' 2>/dev/null; do sleep 2; done &&
      echo 'API is ready, starting benchmark...' &&
      python -m tools.search_benchmarker
      --base-url http://api:8001
      --output /app/benchmark.png
      --json-output /app/benchmark.json"

volumes:
  postgres_data:
  qdrant_data: